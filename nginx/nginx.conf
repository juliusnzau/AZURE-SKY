worker_processes auto;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  sendfile on; tcp_nopush on; keepalive_timeout 30;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml; gzip_min_length 512;
  client_max_body_size 30m;                      # KYC + up to 6 item photos per request
  limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;

  # Docker DNS: re-resolves "api" so `docker compose up --scale api=N` load-balances across replicas.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; expires 5m; }
    location ~* \.(css|js)$ { expires 1h; }

    # Public uploads (item photos, logos) straight from disk / CDN origin — never hits Node.
    location /files/ { alias /data/uploads/public/; expires 30d; add_header Cache-Control "public, immutable"; access_log off; }

    location /api/ {
      limit_req zone=perip burst=60 nodelay;
      set $api http://api:4000;
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # Payment webhooks. In production, restrict to Safaricom / Airtel source IPs, e.g.:
    #   allow <safaricom-ip-range>; allow <airtel-ip-range>; deny all;
    # (get the current ranges from your Daraja / Airtel onboarding documentation).
    location /api/callbacks/ {
      set $api http://api:4000;
      proxy_pass $api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
  # TLS: terminate HTTPS here (certbot/Let's Encrypt) or at your load balancer / Cloudflare. M-Pesa callbacks require public HTTPS.
}
